[project]
name = "hyperbot"
version = "0.1.0"
description = "Research-first market-making bot for Hyperliquid"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hyperliquid-python-sdk>=0.23.0",
  "websockets>=15.0",
]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperbot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hyperbot"]
mypy_path = "src"
